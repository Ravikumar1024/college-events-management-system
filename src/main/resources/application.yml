server:
  port: "${PORT:${SERVER_PORT:8080}}"
spring:
  web:
    resources:
      static-locations: classpath:/static/,file:frontend/
  application:
    name: offbeat-campus
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
app:
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Offbeat}
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:Q2FtcHVzQ29ubmVjdERldmVsb3BtZW50U2VjcmV0S2V5Rm9ySldUMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5500}
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
